[project]
name = "speechlm"
version = "0.1.0"
description = "Speech BabyLM: datasets and zero-shot evaluation of speech models"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pandas>=3.0.2,<4",
    "tqdm>=4.67.3,<5",
    "transformers>=4.48,<5",  # slamkit (Slam) does not load under transformers 5
    "pyprind>=2.11.3,<3",
    "python-dotenv>=1.2.2,<2",
    "huggingface_hub>=0.34,<1",  # what transformers 4 accepts
    "polars>=1.39.3,<2",
    "matplotlib>=3.10,<4",
    "seaborn>=0.13.2,<0.14",
    "pyyaml>=6,<7",
    "tabulate>=0.9,<0.11",
    "browser-cookie3>=0.20.1,<0.21",
    "soundfile>=0.13.1,<0.14",
    "torch>=2.14,<2.15",  # its macOS wheels need macOS 14 or newer
    "torchaudio==2.11.0",  # 2.11.1 fails to load with some torch versions (undefined symbol)
    "librosa>=0.11",
    # src/speechlm/zero_shot/tasks/abx/conditions.py uses fastabx.dataset.read_labels (not exported)
    "fastabx>=0.9.0,<0.10",
    "tbdb @ git+https://github.com/TalkBank/TBDBpy",
    # Slam's model, tokeniser and scoring
    "slamkit @ git+https://github.com/slp-rl/slamkit@388b40222a1736930dad5e6b231754217c69629a",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/speechlm"]

[tool.hatch.metadata]
allow-direct-references = true  # the git dependencies

[tool.ruff]
extend-exclude = ["src/speechlm/zero_shot/models/vendors"]
line-length = 100

[tool.ruff.lint]
select = [
    "ALL", # include all the rules, including new ones
]
ignore = [
    "D",        # all docstring rules
    "ANN",      # all type annotation rules
    "PLR0913",  # too many arguments
    "FBT",      # boolean argument rules
    "RET501",   # unnecessary return statement
    "COM812",   # formatter issue
    "T201",     # Checks for print statements
]