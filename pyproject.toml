[project]
name = "speechlm"
version = "0.1.0"
description = "Speech BabyLM: datasets and zero-shot evaluation of speech models"
requires-python = ">=3.12"
# dependencies are managed by pixi (pixi.toml)

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/speechlm"]

[tool.ruff]
extend-exclude = ["src/speechlm/zero_shot/models/vendors"]
line-length = 100

[tool.ruff.lint]
select = [
    "ALL", # include all the rules, including new ones
]
ignore = [
    "D",        # all docstring rules
    "ANN",      # all type annotation rules
    "PLR0913",  # too many arguments
    "FBT",      # boolean argument rules
    "RET501",   # unnecessary return statement
    "COM812",   # formatter issue
    "T201",     # Checks for print statements
]