[workspace]
authors = ["gifdog97 <omusubset.s@gmail.com>", "nikitas-theo <nikitastheodorop@gmail.com>"]
channels = ["conda-forge"]
name = "speech-babylm-dev"
platforms = ["osx-arm64", "linux-64"]
version = "0.1.0"

[system-requirements]
macos = "14.0"  # torch 2.14 only has macOS wheels from 14.0
libc = "2.34"  # so the Linux wheels of torchdtw (manylinux_2_34) are used, not built from source

[tasks]
download-childes-data = "python src/speechlm/dataset/download_talkbank_data.py --corpus-name childes --subset-name Eng-AAE Eng-NA Eng-UK"
download-phonbank-data = "python src/speechlm/dataset/download_talkbank_data.py --corpus-name phon --subset-name Eng-NA Eng-UK"
extract-childes-metadata = "python src/speechlm/dataset/extract_metadata.py --output_path src/speechlm/dataset/output/childes_metadata.csv"

[dependencies]
python = "3.12.*"
pandas = ">=3.0.2,<4"
tqdm = ">=4.67.3,<5"
transformers = ">=4.48,<5"  # slamkit (Slam) does not load under transformers 5
pyprind = ">=2.11.3,<3"
python-dotenv = ">=1.2.2,<2"
huggingface_hub = ">=0.34,<1"  # what transformers 4 accepts
polars = ">=1.39.3,<2"
matplotlib = ">=3.10,<4"
seaborn = ">=0.13.2,<0.14"
pyyaml = ">=6,<7"
tabulate = ">=0.9,<0.11"

[pypi-dependencies]
speechlm = { path = ".", editable = true }  # this repo's src/speechlm
browser-cookie3 = ">=0.20.1, <0.21"
tbdb = { git = "https://github.com/TalkBank/TBDBpy" }
soundfile = ">=0.13.1, <0.14"
torch = ">=2.14,<2.15"
torchaudio = "==2.11.0"  # 2.11.1 fails to load with some torch versions (undefined symbol)
librosa = ">=0.11"
fastabx = ">=0.9.0,<0.10"  # src/speechlm/zero_shot/tasks/abx/conditions.py uses fastabx.dataset.read_labels (not exported)
slamkit = { git = "https://github.com/slp-rl/slamkit", rev = "388b40222a1736930dad5e6b231754217c69629a" }  # Slam's model, tokeniser and scoring
